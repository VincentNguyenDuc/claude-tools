[project]
name = "claude-dag"
version = "0.2.1"
description = "File-backed planning DAG (.claude-dag/) with a CLI, local web UI and MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6",
]

[project.scripts]
claude-dag = "claude_dag.cli:main"
claude-dag-mcp = "claude_dag.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_dag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
