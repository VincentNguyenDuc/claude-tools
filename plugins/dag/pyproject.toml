[project]
name = "claude-dag"
version = "0.1.0"
description = "File-backed planning DAG (.claude-dag/) with a CLI and local web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
claude-dag = "claude_dag.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_dag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
